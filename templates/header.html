<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
  <div class="container px-4 px-lg-5">
    <a class="navbar-brand" href="{{ url_for('home') }}">
      <i class="fas fa-pen-nib me-2"></i>Ahmad's Blog
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
      aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
      Menu <i class="fas fa-bars"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ms-auto py-4 py-lg-0">
        <li class="nav-item">
          <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('home') }}">
            <i class="fas fa-home me-1"></i>Home
          </a>
        </li>
        {% if not user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('login') }}">
              <i class="fas fa-sign-in-alt me-1"></i>Log In
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('register') }}">
              <i class="fas fa-user-plus me-1"></i>Register
            </a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('create_post') }}">
              <i class="fas fa-plus-circle me-1"></i>New Post
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('logout') }}">
              <i class="fas fa-sign-out-alt me-1"></i>Log Out
            </a>
          </li>
        {% endif %}
        <li class="nav-item">
          <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('about') }}">
            <i class="fas fa-user me-1"></i>About
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-lg-3 py-3 py-lg-4" href="{{ url_for('contact') }}">
            <i class="fas fa-envelope me-1"></i>Contact
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Header -->
<header class="masthead" style="background-image: url('{{ bg_image }}');">
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="site-heading">
          <h1>{{ H1 }}</h1>
          <span class="subheading">{{ H2 }}</span>
        </div>
      </div>
    </div>
  </div>
</header>
