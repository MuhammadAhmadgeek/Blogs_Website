{% extends "base.html" %}
{% block title %}Contact — Ahmad's Blog{% endblock %}

{% block content %}
<main class="mb-5">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">

        <div class="contact-card">
          <p class="contact-intro">
            <i class="fas fa-paper-plane me-2"></i>
            Want to get in touch? Fill out the form below and I'll get back to you as soon as possible!
          </p>

          <form id="contactForm" method="POST" action="/contact">
            <div class="form-floating mb-3">
              <input class="form-control contact-input" id="name" name="name" type="text"
                     placeholder="Enter your name..." required />
              <label for="name"><i class="fas fa-user me-1"></i> Name</label>
            </div>

            <div class="form-floating mb-3">
              <input class="form-control contact-input" id="email" name="email" type="email"
                     placeholder="Enter your email..." required />
              <label for="email"><i class="fas fa-envelope me-1"></i> Email Address</label>
            </div>

            <div class="form-floating mb-3">
              <input class="form-control contact-input" name="phone" id="phone" type="tel"
                     placeholder="Enter your phone number..." />
              <label for="phone"><i class="fas fa-phone me-1"></i> Phone Number (optional)</label>
            </div>

            <div class="form-floating mb-4">
              <textarea class="form-control contact-input" name="message" id="message"
                        placeholder="Enter your message here..." style="height: 12rem" required></textarea>
              <label for="message"><i class="fas fa-comment me-1"></i> Message</label>
            </div>

            <div class="d-grid">
              <button class="btn btn-primary-custom btn-lg text-uppercase" id="submitButton" type="submit">
                <i class="fas fa-paper-plane me-2"></i>Send Message
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</main>
{% endblock %}
