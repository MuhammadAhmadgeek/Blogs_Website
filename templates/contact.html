{% extends "base.html" %}
{% block title %}Contact — Ahmad's Blog{% endblock %}

{% block content %}
<main class="mb-5">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">

        <div class="contact-card">
          <p class="contact-intro">
            <i class="fas fa-paper-plane me-2"></i>
            Want to get in touch? Fill out the form below and I'll get back to you as soon as possible!
          </p>

          <form id="contactForm" method="POST" action="/contact">

            <div class="mb-3">
              <label class="contact-label" for="name">
                <i class="fas fa-user me-1"></i> Name
              </label>
              <input class="form-control" id="name" name="name" type="text"
                     placeholder="Enter your name..." required />
            </div>

            <div class="mb-3">
              <label class="contact-label" for="email">
                <i class="fas fa-envelope me-1"></i> Email Address
              </label>
              <input class="form-control" id="email" name="email" type="email"
                     placeholder="Enter your email..." required />
            </div>

            <div class="mb-3">
              <label class="contact-label" for="phone">
                <i class="fas fa-phone me-1"></i> Phone Number <span class="text-muted">(optional)</span>
              </label>
              <input class="form-control" name="phone" id="phone" type="tel"
                     placeholder="Enter your phone number..." />
            </div>

            <div class="mb-4">
              <label class="contact-label" for="message">
                <i class="fas fa-comment me-1"></i> Message
              </label>
              <textarea class="form-control" name="message" id="message"
                        placeholder="Enter your message here..." rows="6" required></textarea>
            </div>

            <div class="d-grid">
              <button class="btn btn-primary-custom btn-lg text-uppercase" id="submitButton" type="submit">
                <i class="fas fa-paper-plane me-2"></i>Send Message
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</main>
{% endblock %}
